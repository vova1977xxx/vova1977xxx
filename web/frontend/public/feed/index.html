<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GEMIVAS — Feed</title>
  <link rel="stylesheet" href="/css/neon.css">
  <link rel="stylesheet" href="/css/feed.css?v=20260120-0132">
</head>
<body class="gv-app">
  <div id="app" class="gv-layout">
    <aside id="sidebar" class="gv-sidebar"></aside>

    <main class="gv-main">
      <div id="feed" class="gv-feed">
        <div id="player" class="gv-player">
          <video id="video" class="gv-video" playsinline autoplay muted loop preload="metadata"></video>

          <div class="gv-overlay">
            <div class="gv-meta">
              <div id="vTitle" class="gv-title">Loading...</div>
              <div id="vTags" class="gv-tags"></div>
            </div>

            <div class="gv-actions">
              <button id="btnLike" class="gv-btn">👍</button>
              <button id="btnShare" class="gv-btn">🔁</button>
              <button id="btnSave" class="gv-btn">⭐</button>
            </div>
          </div>
        </div>

        <div class="gv-hint">Scroll ↓ / ↑</div>
      </div>
    </main>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/feed.js?v=20260120-0132?v=209"></script>

<!-- GEMIVAS_UI_PATCH_V1 -->
<style>
#gv_controls{position:fixed;right:14px;bottom:92px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.gv_btn{background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.14);color:#fff;padding:10px 12px;border-radius:14px;font-weight:900}
#gv_hint{position:fixed;left:14px;bottom:18px;z-index:9999;opacity:.75;font-size:12px;font-weight:700}
</style>
<div id="gv_controls">
  <button class="gv_btn" id="gv_mute">🔇</button>
</div>
<div id="gv_hint">tap video = pause/play</div>
<script>
(function(){
  const v=document.querySelector("video");
  if(!v) return;
  v.addEventListener("click",()=>{ if(v.paused) v.play(); else v.pause(); });
  const b=document.getElementById("gv_mute");
  const upd=()=>{ b.textContent = v.muted ? "🔇" : "🔊"; };
  b.addEventListener("click",()=>{ v.muted=!v.muted; upd(); });
  upd();
})();
</script>

<!-- GEMIVAS_UI_PATCH_V2 -->
<style>
#gv_loader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9998;
background:rgba(0,0,0,.55);padding:10px 14px;border-radius:16px;font-weight:900;display:none}
#gv_progress_wrap{position:fixed;left:0;right:0;bottom:0;height:4px;z-index:9998;background:rgba(255,255,255,.12)}
#gv_progress{height:100%;width:0%}
</style>
<div id="gv_loader">loading…</div>
<div id="gv_progress_wrap"><div id="gv_progress"></div></div>
<script>
(function(){
  const v=document.querySelector("video");
  if(!v) return;
  const L=document.getElementById("gv_loader");
  const P=document.getElementById("gv_progress");

  function show(x){ L.style.display = x ? "block":"none"; }

  v.addEventListener("waiting",()=>show(true));
  v.addEventListener("stalled",()=>show(true));
  v.addEventListener("canplay",()=>show(false));
  v.addEventListener("playing",()=>show(false));
  v.addEventListener("error",()=>show(false));

  v.addEventListener("timeupdate",()=>{
    if(!v.duration || !isFinite(v.duration)) return;
    const pr=(v.currentTime/v.duration)*100;
    P.style.width = pr.toFixed(2)+"%";
  });
})();
</script>


<!-- GEMIVAS_UI_PATCH_V3 -->
<style>
#gv_modes{position:fixed;left:14px;top:14px;z-index:9999;display:flex;gap:8px}
.gv_mode{background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.14);color:#fff;
padding:8px 10px;border-radius:14px;font-weight:900;font-size:13px;cursor:pointer}
.gv_mode.active{border-color:rgba(125,211,252,.9)}
</style>
<div id="gv_modes">
  <div class="gv_mode active" id="gv_fresh">Fresh</div>
  <div class="gv_mode" id="gv_hot">Trending</div>
</div>
<script>
(function(){
  const btnFresh=document.getElementById("gv_fresh");
  const btnHot=document.getElementById("gv_hot");

  function setMode(m){
    try{ localStorage.setItem("gv_mode",m); }catch(e){}
    btnFresh.classList.toggle("active", m==="fresh");
    btnHot.classList.toggle("active", m==="hot");

    // update API URL if script uses /api/feed already
    try{
      window.GEMIVAS_FEED_MODE = m;
      if(typeof window.loadFeed==="function"){ window.loadFeed(true); }
      else location.reload();
    }catch(e){ location.reload(); }
  }

  let m="fresh";
  try{ m=localStorage.getItem("gv_mode")||"fresh"; }catch(e){}
  setMode(m);

  btnFresh.onclick=()=>setMode("fresh");
  btnHot.onclick=()=>setMode("hot");
})();
</script>


<!-- GEMIVAS_FEED_MODE_HOOK -->
<script>
(function(){
  // hook fetch("/api/feed") -> fetch("/api/feed?mode=fresh|hot")
  const _fetch = window.fetch;
  window.fetch = function(url, opt){
    try{
      if(typeof url==="string" && url.startsWith("/api/feed")){
        let m="fresh";
        try{ m=localStorage.getItem("gv_mode")||"fresh"; }catch(e){}
        if(url.indexOf("mode=")===-1){
          url = url + (url.indexOf("?")>=0 ? "&" : "?") + "mode=" + encodeURIComponent(m);
        }
      }
    }catch(e){}
    return _fetch(url,opt);
  };
})();
</script>


<!-- GEMIVAS_UI_PATCH_V4 -->
<style>
#gv_cats{position:fixed;left:14px;top:54px;z-index:9999;display:flex;gap:8px;flex-wrap:wrap;max-width:70vw}
.gv_cat{background:rgba(2,6,23,.86);border:1px solid rgba(255,255,255,.12);color:#fff;
padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px;cursor:pointer}
.gv_cat.active{border-color:rgba(34,197,94,.9)}
</style>
<div id="gv_cats"></div>
<script>
(function(){
  const cats=[
    ["all","All"],
    ["fun","Funny"],
    ["animals","Animals"],
    ["wow","Wow"],
    ["music","Music"]
  ];
  const wrap=document.getElementById("gv_cats");
  if(!wrap) return;

  function setCat(c){
    try{ localStorage.setItem("gv_cat",c); }catch(e){}
    [...wrap.querySelectorAll(".gv_cat")].forEach(x=>{
      x.classList.toggle("active", x.dataset.cat===c);
    });
    location.reload();
  }

  let cur="all";
  try{ cur=localStorage.getItem("gv_cat")||"all"; }catch(e){}

  wrap.innerHTML="";
  cats.forEach(([id,name])=>{
    const b=document.createElement("div");
    b.className="gv_cat";
    b.dataset.cat=id;
    b.textContent=name;
    b.onclick=()=>setCat(id);
    wrap.appendChild(b);
  });

  setTimeout(()=>setCat(cur),0);
})();
</script>


<!-- GEMIVAS_FEED_CAT_HOOK -->
<script>
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opt){
    try{
      if(typeof url==="string" && url.startsWith("/api/feed")){
        let cat="all";
        try{ cat=localStorage.getItem("gv_cat")||"all"; }catch(e){}
        if(url.indexOf("cat=")===-1){
          url = url + (url.indexOf("?")>=0 ? "&" : "?") + "cat=" + encodeURIComponent(cat);
        }
      }
    }catch(e){}
    return _fetch(url,opt);
  };
})();
</script>




<!-- GEMIVAS_SWIPE_V1 -->
<script>
(function(){
  let y0=null,t0=0; const TH=60;
  function go(dir){
    try{ window.dispatchEvent(new WheelEvent("wheel",{deltaY:dir>0?120:-120})); }catch(e){}
  }
  addEventListener("touchstart",(e)=>{
    if(!e.touches||!e.touches[0])return;
    y0=e.touches[0].clientY; t0=Date.now();
  },{passive:true});
  addEventListener("touchend",(e)=>{
    if(y0===null)return;
    const y1=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY:y0;
    const dy=y1-y0, dt=Date.now()-t0; y0=null;
    if(dt>800||Math.abs(dy)<TH)return;
    if(dy<0)go(+1); else go(-1);
  },{passive:true});
})();
</script>

</body>
</html>
