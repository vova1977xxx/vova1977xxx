server {
  server_name gemivas.com www.gemivas.com;
  location = / { return 301 /feed/; }
  root /srv/web;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location /feed/ {
    try_files $uri $uri/ /feed/index.html;
  location /feed/videos/ { alias /srv/web/feed/videos/; add_header Cache-Control "public, max-age=31536000, immutable"; add_header Accept-Ranges bytes; }

  }
  location /radio/ { alias /srv/web/radio/; index index.html; }

  location /news/ { alias /srv/web/news/; index index.html; }

  location /about/ { alias /srv/web/frontend/public/; try_files /about.html =404; }
  location /privacy/ { alias /srv/web/frontend/public/; try_files /privacy.html =404; }
  location /donate/ { alias /srv/web/frontend/public/; try_files /donate.html =404; }



  location /api/ {
    proxy_pass http://127.0.0.1:9002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gemivas.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gemivas.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.gemivas.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gemivas.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name gemivas.com www.gemivas.com;
  location = / { return 301 /feed/; }
    return 404; # managed by Certbot




}